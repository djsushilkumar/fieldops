plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file('key.properties')
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def keystorePath = System.getenv('KEYSTORE_PATH') ?: keystoreProperties.getProperty('storeFile')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def keyAlias = System.getenv('KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def keyPassword = System.getenv('KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')

android {
    namespace = "com.fieldops.field_ops"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.fieldops.field_ops"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                def kFile = file(keystorePath)
                if (!kFile.exists() && rootProject.file(keystorePath).exists()) {
                    kFile = rootProject.file(keystorePath)
                }
                storeFile kFile
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = null
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
